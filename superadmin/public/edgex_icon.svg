<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    
    <!-- Accent Electric Blue Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    
    <!-- White Highlight Gradient -->
    <linearGradient id="white-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Grid Pattern Overlay for Tech Aesthetic -->
  <g opacity="0.08">
    <line x1="64" y1="0" x2="64" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="128" y1="0" x2="128" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="192" y1="0" x2="192" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="256" y1="0" x2="256" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="320" y1="0" x2="320" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="384" y1="0" x2="384" y2="512" stroke="#ffffff" stroke-width="2" />
    <line x1="448" y1="0" x2="448" y2="512" stroke="#ffffff" stroke-width="2" />
    
    <line x1="0" y1="64" x2="512" y2="64" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="128" x2="512" y2="128" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="192" x2="512" y2="192" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="256" x2="512" y2="256" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="320" x2="512" y2="320" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="384" x2="512" y2="384" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="448" x2="512" y2="448" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Stylized "EdgeX" Vector Logo -->
  <g transform="translate(256, 256)">
    <!-- First Stroke: Cyan diagonal from top-left to bottom-right -->
    <path d="M -110 -110 L -50 -110 L 110 110 L 50 110 Z" fill="url(#accent-grad)" filter="url(#glow)" opacity="0.9" />
    
    <!-- Second Stroke: Intersecting White diagonal from bottom-left to top-right -->
    <path d="M -110 110 L -50 110 L 110 -110 L 50 -110 Z" fill="url(#white-grad)" />

    <!-- POS Retail growth/tick overlay inside the center core -->
    <!-- Represents transaction checkmark and edge of technology -->
    <path d="M -30 -15 L -5 -40 L 45 10 L 120 -65 L 140 -45 L 45 50 Z" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Accent dot reflecting modern node connection -->
  <circle cx="396" cy="211" r="16" fill="#ffffff" filter="url(#glow)" />
</svg>
