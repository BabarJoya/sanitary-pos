<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/edgex_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Paint the last-used theme before React loads (avoids a light flash in dark mode).
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("edgex_theme_last") || "{}");
          var m = t.mode === "system" ? (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t.mode;
          document.documentElement.dataset.theme = m === "dark" ? "dark" : "light";
          document.documentElement.dataset.accent = t.accent || "blue";
        } catch (e) {}
      })();
    </script>
    <title>EdgeX POS - Multipurpose Point of Sale</title>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
